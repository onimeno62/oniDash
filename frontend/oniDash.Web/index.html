<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="oniDash — local-first media library dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>oniDash</title>
    <script>
      // Avoid a light flash for users who chose a non-default theme.
      try {
        var stored = localStorage.getItem('onidash.theme');
        if (stored === 'light' || stored === 'dark' || stored === 'system') {
          if (stored === 'system') {
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {
        /* private mode — keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
